<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Research Paper Organizer</title>
  <desc id="d">Banner showing a stack of research notes with a magnifying glass, the project title, and the tech stack: Python, PyQt6, SQLite, Markdown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- decorative glows -->
    <circle cx="1080" cy="40" r="180" fill="#67e8f9" opacity="0.10"/>
    <circle cx="1150" cy="300" r="140" fill="#c4b5fd" opacity="0.12"/>
    <circle cx="40" cy="300" r="120" fill="#67e8f9" opacity="0.08"/>

    <!-- dot grid -->
    <g fill="#ffffff" opacity="0.10">
      <circle cx="760" cy="40" r="2"/><circle cx="790" cy="40" r="2"/><circle cx="820" cy="40" r="2"/><circle cx="850" cy="40" r="2"/><circle cx="880" cy="40" r="2"/>
      <circle cx="760" cy="64" r="2"/><circle cx="790" cy="64" r="2"/><circle cx="820" cy="64" r="2"/><circle cx="850" cy="64" r="2"/><circle cx="880" cy="64" r="2"/>
      <circle cx="760" cy="88" r="2"/><circle cx="790" cy="88" r="2"/><circle cx="820" cy="88" r="2"/><circle cx="850" cy="88" r="2"/><circle cx="880" cy="88" r="2"/>
    </g>

    <!-- illustration: stacked notes -->
    <g filter="url(#shadow)">
      <rect x="92" y="62" width="170" height="210" rx="14" fill="#a5b4fc" opacity="0.55" transform="rotate(-10 177 167)"/>
      <rect x="104" y="58" width="170" height="210" rx="14" fill="#c4b5fd" opacity="0.8" transform="rotate(-4 189 163)"/>
      <rect x="116" y="52" width="170" height="214" rx="14" fill="url(#paper)"/>
    </g>
    <!-- note content -->
    <rect x="116" y="52" width="170" height="40" rx="14" fill="#4f46e5"/>
    <rect x="116" y="76" width="170" height="16" fill="#4f46e5"/>
    <text x="134" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff"># Notes</text>
    <g fill="#94a3b8">
      <rect x="134" y="112" width="134" height="8" rx="4"/>
      <rect x="134" y="132" width="110" height="8" rx="4"/>
      <rect x="134" y="152" width="124" height="8" rx="4"/>
    </g>
    <rect x="134" y="176" width="70" height="8" rx="4" fill="#6366f1"/>
    <g fill="#94a3b8">
      <rect x="134" y="196" width="130" height="8" rx="4"/>
      <rect x="134" y="216" width="96" height="8" rx="4"/>
      <rect x="134" y="236" width="118" height="8" rx="4"/>
    </g>

    <!-- magnifying glass -->
    <g filter="url(#shadow)">
      <circle cx="262" cy="226" r="40" fill="#0f172a" fill-opacity="0.35" stroke="url(#accent)" stroke-width="9"/>
      <line x1="291" y1="255" x2="326" y2="290" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
    </g>
    <path d="M246 214 a22 22 0 0 1 20 -10" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>

    <!-- title block -->
    <text x="380" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="url(#accent)">RESEARCH</text>
    <text x="380" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Paper Organizer</text>
    <rect x="382" y="216" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="380" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#cbd5e1">Write  ·  Search  ·  Organize your research notes</text>

    <!-- tech chips -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#e0e7ff" text-anchor="middle">
      <rect x="380" y="272" width="86" height="30" rx="15" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="423" y="292">Python</text>
      <rect x="478" y="272" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="518" y="292">PyQt6</text>
      <rect x="570" y="272" width="84" height="30" rx="15" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="612" y="292">SQLite</text>
      <rect x="666" y="272" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="718" y="292">Markdown</text>
    </g>

    <!-- part 1 badge -->
    <g transform="translate(1000 36)">
      <rect width="164" height="36" rx="18" fill="#f59e0b"/>
      <text x="82" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">PART 1 · PROTOTYPE</text>
    </g>
  </g>
</svg>
